---
layout: default
---
<article class="post">
  <p class="post-date">{% if page.display_date %}{{ page.display_date }}{% else %}{{ page.date | date: "%Y年%-m月%-d日" }}{% endif %}{% if page.category_ja %}　<span class="tag">{{ page.category_ja }}</span>{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {{ content }}
  <p class="back"><a href="{{ '/news/' | relative_url }}">← お知らせ一覧</a></p>
</article>
