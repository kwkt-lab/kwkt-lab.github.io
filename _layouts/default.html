<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-ja">川喜田研究室</span>
      <span class="brand-en">IoT Systems Lab, Kanagawa Institute of Technology</span>
    </a>
    <nav>
      {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>{% endfor %}
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>川喜田研究室（IoTシステム研究室）／神奈川工科大学 情報学部 情報工学科<br>
    〒243-0292 神奈川県厚木市下荻野1030</p>
    <p class="links">
      <a href="https://researchmap.jp/kwkt">researchmap</a>
      <a href="https://orcid.org/0000-0002-0169-6228">ORCID</a>
      <a href="https://github.com/kwkt-lab">GitHub</a>
      <a href="{{ '/news/feed.xml' | relative_url }}">RSS</a>
      <a href="https://www.kait.jp/research/navi/kawakita.html">大学の研究者紹介</a>
    </p>
    <p class="updated">最終更新：{{ site.time | date: "%Y年%-m月%-d日" }}</p>
  </div>
</footer>
</body>
</html>
